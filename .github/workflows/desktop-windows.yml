name: Desktop Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dummy Firebase config (app module needs a file to configure)
        shell: bash
        run: |
          mkdir -p app
          printf '{"project_info":{"project_number":"0","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:0:android:1","android_client_info":{"package_name":"me.rerere.rikkahub.debug"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json

      - name: Install WiX Toolset
        run: choco install wixtoolset --no-progress -y

      - name: Build desktop distribution (app image + MSI)
        shell: bash
        run: |
          ./gradlew :desktop:createDistributable :desktop:packageMsi --console=plain

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiquidHub-Windows
          path: |
            desktop/build/compose/binaries/main/**
          if-no-files-found: warn
